<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap">
<style>
html{background:#000}
body{margin:0;background:#000;overscroll-behavior:none}
.app{width:100%;max-width:430px;height:100vh;height:100dvh;margin:0 auto;box-sizing:border-box;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
a{color:#fff}a:hover{color:#ddd}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
input::placeholder{color:#8e8f93}
.hs{scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
@keyframes novoPulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.75);transform:scale(1)}50%{transform:scale(1.04)}70%{box-shadow:0 0 0 14px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0);transform:scale(1)}}
.pulse{animation:novoPulse 1.8s ease-out infinite}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
button:focus{outline:none}
@keyframes phPulse{0%,100%{opacity:1}50%{opacity:.35}}
input.phPulse{animation:phPulse 1.4s ease-in-out infinite}
input.phPulse::placeholder{color:#f87171}
@media (prefers-reduced-motion: reduce){input.phPulse{animation:none}}
</style>
</helmet>

5

Enviar

<label for="prompt" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Descreva o que você quer criar</label>
<input id="prompt" type="text" ref="{{ inputRef }}" class="{{ inputClass }}" placeholder="{{ placeholder }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" onInput="{{ onType }}" style="width: 100%; border: 0; outline: none; background: transparent; color: #fff; font-family: inherit; font-size: 22px; padding: 0">
<div style="display: flex; align-items: center; gap: 8px">
<button aria-label="Adicionar" style="width: 44px; height: 44px; border: 0; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center; padding: 0; margin-left: -10px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v16M4 12h16"></path></svg>
</button>
<div style="flex: 1"></div>
<button class="{{ pillClass }}" onClick="{{ toggleMenu }}" aria-label="Configurações de geração" style="height: 47px; padding: 0 22px; border-radius: 24px; border: 1px solid #3a3b3f; background: #2a2b2e; color: #c9cacd; font-size: 15px; display: flex; align-items: center; gap: 12px; cursor: pointer">
{{ modeLabel }}
<span style="display: block; width: {{ pillW }}px; height: {{ pillH }}px; border: 1.8px solid currentColor; border-radius: 2px; box-sizing: border-box"></span>
<span>x{{ count }}</span>
</button>
<button aria-label="Gerar" style="width: 50px; height: 50px; border-radius: 50%; border: 1px solid #2b2c2f; background: transparent; color: #7c7d81; display: flex; align-items: center; justify-content: center; padding: 0">

</button>
</div>
</div>

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">

Imagem

</div>
</sc-if>

<button class="{{ modelClass }}" onClick="{{ toggleModel }}" aria-label="Escolher modelo" style="height: 54px; border: 0; border-radius: 16px; background: #212226; color: #fff; font-size: 17px; position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<sc-if value="{{ isImage }}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M4 18.5c6.5 1.5 13-2.5 14-11l1-2.5-2-1-1 2.5c-.5 6-5.5 10-11.5 10-1 0-1.5.4-1.5 1z" fill="#f4c430"></path><path d="M17.5 4.5l.8-2" stroke="#7a5520" stroke-width="2" stroke-linecap="round"></path></svg>
</sc-if>
{{ model }}
<sc-if value="{{ modelOpen }}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="position: absolute; right: 24px; top: 18px"><path d="M5 5l14 14M19 5L5 19"></path></svg>
</sc-if>
<sc-if value="{{ modelClosed }}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="12" height="8" viewBox="0 0 12 8" fill="currentColor" style="position: absolute; right: 26px; top: 23px"><path d="M0 0h12L6 7z"></path></svg>
</sc-if>
</button>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      screen: 'home', menu: false, focused: false, modelOpen: false,
      mode: 'image', imgAspect: '9:16', imgCount: 1, imgModel: 'Nano Banana 2.1',
      vidAspect: '9:16', res: '360p', vidCount: 1, dur: '8s', vidModel: 'Omni 1.1 Flash'
    };
  }
  renderVals() {
    const s = this.state;
    const ON_BG = '#2f3034', ON_FG = '#ffffff', OFF_BG = 'transparent', OFF_FG = '#8b8c90';
    const seg = (on) => ({ bg: on ? ON_BG : OFF_BG, fg: on ? ON_FG : OFF_FG });
    const set = (patch) => () => this.setState(patch);
    const isImage = s.mode === 'image';
    const dims = { '16:9': [18, 11], '4:3': [17, 13], '1:1': [14, 14], '3:4': [13, 17], '9:16': [11, 18] };
    const aspect = isImage ? s.imgAspect : s.vidAspect;
    const count = isImage ? s.imgCount : s.vidCount;
    const pillDims = { '16:9': [16, 10], '4:3': [14, 11], '1:1': [12, 12], '3:4': [11, 14], '9:16': [10, 16] }[aspect];
    const vidModelList = [['Omni 1.1 Flash', 6], ['Veo 3.1 - Lite', 10], ['Veo 3.1 - Fast', 20]];
    const vidCost = (vidModelList.find((m) => m[0] === s.vidModel) || vidModelList[0])[1];
    const model = isImage ? s.imgModel : s.vidModel;
    const isProject = s.screen === 'project';
    const menuOpen = isProject && s.menu;
    return {
      isHome: s.screen === 'home',
      isProject,
      menuOpen,
      isImage,
      isVideo: !isImage,
      showEmpty: isProject && !s.menu,
      emptyOpacity: s.focused ? 0.35 : 1,
      modelOpen: menuOpen && s.modelOpen,
      modelClosed: !(menuOpen && s.modelOpen),
      showRows: !s.modelOpen,
      modelOpenImage: menuOpen && s.modelOpen && isImage,
      modelOpenVideo: menuOpen && s.modelOpen && !isImage,
      composerBorder: s.focused ? '#3a3b3f' : '#151618',
      composerRadius: s.focused ? '40px' : (s.menu ? '40px' : '40px 40px 0 0'),
      modeLabel: isImage ? 'Imagem' : 'Vídeo',
      pillW: pillDims[0], pillH: pillDims[1],
      count,
      credits: isImage ? 0 : vidCost * s.vidCount,
      model,
      openProject: set({ screen: 'project', menu: false, focused: false, modelOpen: false }),
      goHome: set({ screen: 'home', menu: false, focused: false, modelOpen: false }),
      toggleMenu: () => this.setState({ menu: !this.state.menu, modelOpen: false }),
      onFocus: set({ focused: true, menu: false, modelOpen: false }),
      onBlur: set({ focused: false }),
      toggleModel: () => this.setState({ modelOpen: !this.state.modelOpen }),
      pickImage: set({ mode: 'image', modelOpen: false }),
      pickVideo: set({ mode: 'video', modelOpen: false }),
      imgTabBg: seg(isImage).bg, imgTabFg: seg(isImage).fg,
      vidTabBg: seg(!isImage).bg, vidTabFg: seg(!isImage).fg,
      vidTabClass: !isImage && s.modelOpen ? '' : 'pulse',
      pillClass: s.menu || s.guided ? '' : 'pulse',
      placeholder: s.guided ? 'Cole o texto copiado aqui' : 'O que você quer fazer?',
      inputClass: s.guided && !s.typed ? 'phPulse' : '',
      inputRef: (el) => { this.inputEl = el; },
      onType: (e) => this.setState({ typed: e.target.value.length > 0 }),
      modelClass: isImage || s.modelOpen ? '' : 'pulse',
      imgAspects: ['16:9', '4:3', '1:1', '3:4', '9:16'].map((k) => ({
        label: k, w: dims[k][0], h: dims[k][1], ...seg(s.imgAspect === k), pick: set({ imgAspect: k })
      })),
      vidAspects: ['16:9', '9:16'].map((k) => ({
        label: k, w: k === '16:9' ? 18 : 11, h: k === '16:9' ? 11 : 18, ...seg(s.vidAspect === k), cls: k === '9:16' ? 'pulse' : '', pick: set({ vidAspect: k })
      })),
      resolutions: ['360p', '720p'].map((k) => ({ label: k, ...seg(s.res === k), cls: k === '360p' ? 'pulse' : '', pick: set({ res: k }) })),
      counts: [1, 2, 3, 4].map((n) => ({
        label: 'x' + n, ...seg(count === n), cls: !isImage && n === 1 ? 'pulse' : '', pick: set(isImage ? { imgCount: n } : { vidCount: n })
      })),
      durations: ['4s', '6s', '8s', '10s'].map((k) => ({ label: k, ...seg(s.dur === k), cls: k === '10s' ? 'pulse' : '', pick: set({ dur: k }) })),
      imgModels: ['Nano Banana Pro', 'Nano Banana 2 Lite', 'Nano Banana 2.1'].map((k) => ({
        label: k, bg: s.imgModel === k ? '#2e2f33' : 'transparent', pick: set({ imgModel: k, modelOpen: false })
      })),
      vidModels: vidModelList.map(([k, c]) => ({
        label: k, sub: c + ' créditos / video', cls: k === 'Veo 3.1 - Lite' ? 'pulse' : '', bg: s.vidModel === k ? '#2e2f33' : 'transparent', pick: k === 'Veo 3.1 - Lite'
          ? () => { this.setState({ vidModel: k, modelOpen: false, menu: false, focused: true, guided: true, typed: false }); if (this.inputEl) this.inputEl.focus(); }
          : set({ vidModel: k, modelOpen: false })
      }))
    };
  }
}
</script>
